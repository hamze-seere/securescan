name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit & integration tests
        run: npm test
      - name: Production build (includes type checking)
        run: npm run build
      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
